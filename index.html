<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>FALAMIGO - Meu Comunicador</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;background:#E3F2FD;height:100vh;overflow:hidden;position:fixed;width:100%}

/* ===== SPLASH ===== */
#splash{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10000}
#splash h1{color:white;font-size:2.2rem;margin-top:15px;font-weight:700}
#splash p{color:rgba(255,255,255,.8);margin:5px 0 20px;font-size:1rem}
#splash input{padding:15px;border:none;border-radius:12px;font-size:1.1rem;text-align:center;width:280px;margin-bottom:10px;outline:none;-webkit-appearance:none}
#splash .tipo-img{display:flex;gap:10px;margin-bottom:15px}
#splash .tipo-img label{display:flex;flex-direction:column;align-items:center;gap:5px;background:rgba(255,255,255,.2);padding:12px 20px;border-radius:12px;color:white;cursor:pointer;transition:all .2s}
#splash .tipo-img label.on{background:rgba(255,255,255,.9);color:#667eea;transform:scale(1.05)}
#splash .tipo-img input{display:none}
#splash button{padding:15px 50px;background:white;color:#667eea;border:none;border-radius:30px;font-size:1.2rem;font-weight:700;cursor:pointer;-webkit-appearance:none}
#splash .mascote{width:140px;height:140px;background:linear-gradient(135deg,#27AE60,#2ecc71);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:float 3s ease-in-out infinite}
#splash .mascote svg{width:80px;height:80px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}

/* ===== APP ===== */
#app{display:none;flex-direction:column;height:100vh;max-width:600px;margin:0 auto;background:#E3F2FD}
#app.visivel{display:flex}

.header{background:#2C3E50;color:white;padding:12px;text-align:center}
.header h1{font-size:1.2rem;font-weight:700}

.display{background:#3498DB;color:white;padding:15px;min-height:60px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.1rem;font-weight:600;word-wrap:break-word}

.controls{display:flex;gap:5px;padding:8px;background:white}
.controls button{flex:1;padding:12px;border:none;border-radius:10px;font-size:.85rem;font-weight:700;color:white;cursor:pointer;-webkit-appearance:none}
.btn-falar{background:#27AE60}.btn-desfazer{background:#F39C12}.btn-limpar{background:#E74C3C}

.content{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch}

/* Abas */
.tabs{display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;padding-bottom:5px;-webkit-overflow-scrolling:touch}
.tab-btn{padding:10px 15px;border:none;border-radius:20px;font-size:.8rem;font-weight:700;color:white;cursor:pointer;white-space:nowrap;-webkit-appearance:none}
.tab-btn.active{box-shadow:0 0 0 3px rgba(0,0,0,.2)}

/* Grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card-btn{padding:20px 10px;border:none;border-radius:12px;font-size:1rem;font-weight:700;color:white;cursor:pointer;transition:all .2s;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;-webkit-appearance:none;position:relative}
.card-btn:active{transform:scale(0.95);filter:brightness(0.9)}
.card-btn .ico{font-size:2.2rem;line-height:1}

/* Rotinas */
.routine-card{background:white;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.routine-card h3{color:#2C3E50;font-size:1.1rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.routine-card h3 .ico{font-size:1.6rem}
.routine-steps{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;-webkit-overflow-scrolling:touch}
.routine-step{flex:0 0 80px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.routine-step .num{width:28px;height:28px;border-radius:50%;background:#3498DB;color:white;font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.routine-step .img{width:60px;height:60px;border-radius:12px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:2rem;overflow:hidden}
.routine-step .img svg{width:50px;height:50px}
.routine-step .txt{font-size:.7rem;color:#555;font-weight:600;line-height:1.2}
.routine-step-wrap{position:relative;flex:0 0 80px}
.routine-play{width:100%;padding:10px;background:#27AE60;color:white;border:none;border-radius:10px;font-size:.9rem;font-weight:700;margin-top:10px;cursor:pointer;-webkit-appearance:none}

/* Criar */
.add-form{background:white;padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.add-form h3{color:#2C3E50;margin-bottom:10px;font-size:1rem}
.add-form input,.add-form select{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:1rem;margin-bottom:8px;outline:none;-webkit-appearance:none}
.add-form button{width:100%;padding:12px;background:#27AE60;color:white;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;-webkit-appearance:none}

/* Nav */
.nav{display:flex;background:white;box-shadow:0 -2px 10px rgba(0,0,0,.1);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:10px 5px;border:none;background:white;color:#666;font-size:.7rem;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;-webkit-appearance:none}
.nav button.on{background:#2C3E50;color:white}
.nav button .ico{font-size:1.4rem;line-height:1}

/* Modal */
#modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px;flex-direction:column}
#modal.visivel{display:flex}
.modal-box{background:white;border-radius:20px;padding:25px;max-width:350px;width:100%;text-align:center;max-height:80vh;overflow-y:auto}
.modal-box h2{margin-bottom:15px;color:#2C3E50}
.modal-step{display:flex;align-items:center;gap:15px;margin:15px 0;text-align:left}
.modal-step .num{width:40px;height:40px;border-radius:50%;background:#3498DB;color:white;font-size:1.2rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-step .img{width:60px;height:60px;border-radius:12px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:2.5rem;flex-shrink:0;overflow:hidden}
.modal-step .img svg{width:50px;height:50px}
.modal-step .info{flex:1}
.modal-step .info h4{color:#2C3E50;font-size:1rem;margin-bottom:3px}
.modal-step .info p{color:#666;font-size:.85rem}
.modal-box button{width:100%;padding:12px;margin:5px 0;border:none;border-radius:10px;font-size:1rem;font-weight:700;color:white;cursor:pointer;-webkit-appearance:none}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:12px 24px;border-radius:25px;font-size:.9rem;z-index:99999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
</style>
<base target="_blank">
</head>

</div>

<!-- ===== MODAL ===== -->
<div id="modal" onclick="fecharModal(event)">
<div class="modal-box" id="modalBox" onclick="event.stopPropagation()"></div>
</div>

// ===== ESTADO =====
var frase = [];
var telaAtual = "falar";
var synth = null;
var vozes = [];
var vozPT = null;
var dados = null;
var tipoImg = "desenho";
var lsOK = false;

// ===== INIT =====
function init() {
    // Test localStorage
    try {
        localStorage.setItem("__test__", "1");
        localStorage.removeItem("__test__");
        lsOK = true;
    } catch(e) {
        lsOK = false;
    }

    // Carregar dados
    if (lsOK) {
        var salvo = localStorage.getItem("falamigo_v3");
        if (salvo) {
            try { dados = JSON.parse(salvo); } catch(e) { dados = null; }
        }
    }
    if (!dados) {
        dados = JSON.parse(JSON.stringify(dadosPadrao));
    }

    // TTS
    if ("speechSynthesis" in window) {
        synth = window.speechSynthesis;
        var carregarVozes = function() {
            vozes = synth.getVoices();
            vozPT = vozes.find(function(v) { return v.lang.indexOf("pt") !== -1; });
            if (!vozPT && vozes.length > 0) vozPT = vozes[0];
        };
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = carregarVozes;
        }
        carregarVozes();
    }

    // Se ja tem nome, pula splash
    if (dados && dados.nome) {
        tipoImg = dados.tipoImg || "desenho";
        document.getElementById("splash").style.display = "none";
        document.getElementById("app").classList.add("visivel");
        mudarTela("falar", document.querySelector(".nav button"));
    }
}

// ===== TIPO IMAGEM =====
function escolherTipo(tipo) {
    tipoImg = tipo;
    document.getElementById("lblFoto").classList.remove("on");
    document.getElementById("lblDesenho").classList.remove("on");
    document.getElementById("lbl" + (tipo === "foto" ? "Foto" : "Desenho")).classList.add("on");
}

// ===== ENTRAR =====
function entrar() {
    var nome = document.getElementById("nomeUser").value.trim();
    if (!nome) {
        alert("Digite seu nome!");
        return;
    }
    dados.nome = nome;
    dados.tipoImg = tipoImg;
    if (lsOK) {
        localStorage.setItem("falamigo_v3", JSON.stringify(dados));
    }

    // Esconder splash, mostrar app
    document.getElementById("splash").style.display = "none";
    document.getElementById("app").classList.add("visivel");

    // TTS boas-vindas
    if (synth) {
        setTimeout(function() {
            var u = new SpeechSynthesisUtterance("Bem-vindo, " + nome + "!");
            u.lang = "pt-BR";
            u.rate = 1;
            if (vozPT) u.voice = vozPT;
            synth.cancel();
            synth.speak(u);
        }, 300);
    }

    mudarTela("falar", document.querySelector(".nav button"));
}

// ===== TTS =====
function falar(texto) {
    if (!texto || !synth) return;
    var u = new SpeechSynthesisUtterance(texto);
    u.lang = "pt-BR";
    u.rate = 1;
    if (vozPT) u.voice = vozPT;
    synth.cancel();
    synth.speak(u);
}

// ===== DISPLAY =====
function atualizarDisplay() {
    var d = document.getElementById("display");
    d.textContent = frase.length === 0 ? "Toque nos botoes para falar..." : frase.join(" > ");
}

function addFrase(texto) {
    frase.push(texto);
    atualizarDisplay();
    falar(texto);
}

function falarTudo() {
    if (frase.length === 0) { falar("Adicione frases primeiro"); return; }
    falar(frase.join(". "));
}

function desfazer() {
    if (frase.length > 0) { frase.pop(); atualizarDisplay(); }
}

function limpar() {
    frase = [];
    atualizarDisplay();
}

// ===== TELAS =====
function mudarTela(tela, btn) {
    telaAtual = tela;
    document.querySelectorAll(".nav button").forEach(function(b) { b.classList.remove("on"); });
    if (btn) btn.classList.add("on");
    var c = document.getElementById("content");
    c.innerHTML = "";
    if (tela === "falar") renderFalar(c);
    else if (tela === "rotinas") renderRotinas(c);
    else if (tela === "criar") renderCriar(c);
    else if (tela === "config") renderConfig(c);
}

// ===== TELA FALAR =====
function renderFalar(c) {
    var tabs = document.createElement("div");
    tabs.className = "tabs";
    dados.abas.forEach(function(aba, idx) {
        var b = document.createElement("button");
        b.className = "tab-btn" + (idx === 0 ? " active" : "");
        b.style.background = aba.cor;
        b.textContent = aba.nome;
        b.onclick = function() {
            document.querySelectorAll(".tab-btn").forEach(function(x) { x.classList.remove("active"); });
            b.classList.add("active");
            mostrarItens(grid, idx);
        };
        tabs.appendChild(b);
    });
    c.appendChild(tabs);
    var grid = document.createElement("div");
    grid.className = "grid";
    c.appendChild(grid);
    mostrarItens(grid, 0);
}

function mostrarItens(grid, abaIdx) {
    grid.innerHTML = "";
    var aba = dados.abas[abaIdx];
    if (!aba) return;
    aba.itens.forEach(function(item) {
        var b = document.createElement("button");
        b.className = "card-btn";
        b.style.background = aba.cor;
        b.innerHTML = '<span class="ico">' + item.ico + '</span><span>' + item.texto + '</span>';
        b.onclick = function() { addFrase(item.texto); };
        grid.appendChild(b);
    });
}

// ===== TELA ROTINAS =====
function renderRotinas(c) {
    var tit = document.createElement("h2");
    tit.style.cssText = "color:#2C3E50;font-size:1.1rem;margin-bottom:12px;text-align:center";
    tit.textContent = "Minhas Rotinas";
    c.appendChild(tit);

    rotinas.forEach(function(r, idx) {
        var card = document.createElement("div");
        card.className = "routine-card";

        var h3 = document.createElement("h3");
        h3.innerHTML = '<span class="ico">' + r.ico + '</span>' + r.nome;
        card.appendChild(h3);

        var steps = document.createElement("div");
        steps.className = "routine-steps";
        r.passos.forEach(function(p, i) {
            var wrap = document.createElement("div");
            wrap.className = "routine-step-wrap";

            var step = document.createElement("div");
            step.className = "routine-step";

            var num = document.createElement("div");
            num.className = "num";
            num.textContent = i + 1;
            step.appendChild(num);

            var img = document.createElement("div");
            img.className = "img";
            if (tipoImg === "foto") {
                img.innerHTML = '<span style="font-size:2rem">' + r.ico + '</span>';
            } else {
                img.innerHTML = svgs[p.svg] || '<span style="font-size:2rem">' + r.ico + '</span>';
            }
            step.appendChild(img);

            var txt = document.createElement("div");
            txt.className = "txt";
            txt.textContent = p.txt;
            step.appendChild(txt);

            wrap.appendChild(step);
            steps.appendChild(wrap);
        });
        card.appendChild(steps);

        var play = document.createElement("button");
        play.className = "routine-play";
        play.textContent = "VER PASSO A PASSO";
        play.onclick = function() { abrirModalRotina(idx); };
        card.appendChild(play);

        c.appendChild(card);
    });
}

function abrirModalRotina(idx) {
    var r = rotinas[idx];
    var box = document.getElementById("modalBox");
    box.innerHTML = '<h2>' + r.ico + ' ' + r.nome + '</h2>';

    r.passos.forEach(function(p, i) {
        var step = document.createElement("div");
        step.className = "modal-step";

        var num = document.createElement("div");
        num.className = "num";
        num.textContent = i + 1;
        step.appendChild(num);

        var img = document.createElement("div");
        img.className = "img";
        if (tipoImg === "foto") {
            img.innerHTML = '<span style="font-size:2.5rem">' + r.ico + '</span>';
        } else {
            img.innerHTML = svgs[p.svg] || '<span style="font-size:2.5rem">' + r.ico + '</span>';
        }
        step.appendChild(img);

        var info = document.createElement("div");
        info.className = "info";
        info.innerHTML = '<h4>' + p.txt + '</h4><p>Toque para ouvir</p>';
        step.appendChild(info);

        step.onclick = function() { falar(p.txt); };
        box.appendChild(step);
    });

    var btn = document.createElement("button");
    btn.style.background = "#27AE60";
    btn.textContent = "FALAR TUDO";
    btn.onclick = function() {
        falar(r.passos.map(function(p) { return p.txt; }).join(". Depois, "));
    };
    box.appendChild(btn);

    var btn2 = document.createElement("button");
    btn2.style.background = "#E74C3C";
    btn2.textContent = "FECHAR";
    btn2.onclick = function() { document.getElementById("modal").classList.remove("visivel"); };
    box.appendChild(btn2);

    document.getElementById("modal").classList.add("visivel");
}

function fecharModal(e) {
    if (e.target.id === "modal") {
        document.getElementById("modal").classList.remove("visivel");
    }
}

// ===== TELA CRIAR =====
function renderCriar(c) {
    var form1 = document.createElement("div");
    form1.className = "add-form";
    form1.innerHTML = '<h3>Criar Nova Aba</h3><input type="text" id="novaAbaNome" placeholder="Nome da aba" autocapitalize="words"><select id="novaAbaCor"><option value="#27AE60">Verde</option><option value="#3498DB">Azul</option><option value="#F39C12">Laranja</option><option value="#E91E63">Rosa</option><option value="#9C27B0">Roxo</option><option value="#E74C3C">Vermelho</option><option value="#00BCD4">Ciano</option><option value="#795548">Marrom</option></select><button onclick="criarAba()">CRIAR ABA</button>';
    c.appendChild(form1);

    var form2 = document.createElement("div");
    form2.className = "add-form";
    var opts = dados.abas.map(function(a, i) { return '<option value="' + i + '">' + a.nome + '</option>'; }).join("");
    form2.innerHTML = '<h3>Adicionar Botao</h3><select id="itemAba">' + opts + '</select><input type="text" id="itemIco" placeholder="Icone (ex: 🍕)" maxlength="10"><input type="text" id="itemTexto" placeholder="O que falar?" autocapitalize="sentences"><button onclick="criarItem()">ADICIONAR BOTAO</button>';
    c.appendChild(form2);
}

function criarAba() {
    var nome = document.getElementById("novaAbaNome").value.trim();
    var cor = document.getElementById("novaAbaCor").value;
    if (!nome) { toast("Digite um nome!"); return; }
    dados.abas.push({ nome: nome, cor: cor, itens: [] });
    salvar();
    toast("Aba criada: " + nome);
    document.getElementById("novaAbaNome").value = "";
}

function criarItem() {
    var abaIdx = parseInt(document.getElementById("itemAba").value);
    var ico = document.getElementById("itemIco").value.trim() || "(*)";
    var texto = document.getElementById("itemTexto").value.trim();
    if (!texto) { toast("Digite o texto!"); return; }
    dados.abas[abaIdx].itens.push({ ico: ico, texto: texto });
    salvar();
    toast("Botao adicionado!");
    document.getElementById("itemIco").value = "";
    document.getElementById("itemTexto").value = "";
}

function salvar() {
    if (lsOK) {
        localStorage.setItem("falamigo_v3", JSON.stringify(dados));
    }
}

// ===== TELA CONFIG =====
function renderConfig(c) {
    var form = document.createElement("div");
    form.className = "add-form";
    form.innerHTML = '<h3>Configuracoes</h3><p style="margin-bottom:10px;color:#666">Nome: <strong>' + (dados.nome || "Nao definido") + '</strong></p><p style="margin-bottom:10px;color:#666">Imagens: <strong>' + (dados.tipoImg === "foto" ? "Fotos Reais" : "Desenhos Ilustrados") + '</strong></p><button onclick="resetar()" style="background:#E74C3C;width:100%;padding:12px;border:none;border-radius:8px;color:white;font-size:1rem;font-weight:700;cursor:pointer">RESETAR TUDO</button>';
    c.appendChild(form);
}

function resetar() {
    if (!confirm("Isso apaga TUDO. Continuar?")) return;
    if (lsOK) localStorage.removeItem("falamigo_v3");
    dados = JSON.parse(JSON.stringify(dadosPadrao));
    toast("Dados resetados! Recarregue a pagina.");
}

// ===== UTIL =====
function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function() { t.classList.remove("show"); }, 3000);
}

// ===== iOS FIXES =====
document.addEventListener("gesturestart", function(e) { e.preventDefault(); });
document.addEventListener("gesturechange", function(e) { e.preventDefault(); });
document.addEventListener("gestureend", function(e) { e.preventDefault(); });

// Ativa TTS no primeiro toque
document.body.addEventListener("touchstart", function() {
    if (synth && !synth.speaking) {
        var u = new SpeechSynthesisUtterance("");
        synth.speak(u);
        synth.cancel();
    }
}, { once: true });

// Iniciar
init();
